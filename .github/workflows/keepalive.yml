name: Keepalive Workflows

on:
  schedule:
    - cron: "0 0 1 * *" # 1st of every month at 00:00 UTC
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Re-enable scheduled workflows
        run: |
          for wf in pipeline.yml keepalive.yml; do
            gh workflow enable "$wf"
          done
