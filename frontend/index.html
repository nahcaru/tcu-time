<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <script>
      ;(() => {
        const storageKey = "theme"
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)")
        const storedTheme = localStorage.getItem(storageKey)
        const resolvedTheme =
          storedTheme === "dark" ||
          (storedTheme !== "light" && prefersDark.matches)
            ? "dark"
            : "light"
        const faviconHref =
          resolvedTheme === "dark" ? "/time-icon-dark.png" : "/time-icon.png"

        document.write(
          `<link id="app-favicon" rel="icon" type="image/png" href="${faviconHref}" />`
        )
      })()
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <title>TCU-TIME</title>
    <meta
      name="description"
      content="Take It More Easily - 都市大院生のための時間割管理サイト"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
